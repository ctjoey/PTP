<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b12">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pick the Play">
  <meta name="format-detection" content="telephone=no">
  <title>{% block title %}Pick the Play: Live Pro Football Game{% endblock %}</title>
  <link rel="icon" href="/static/img/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="stylesheet" href="/static/css/style.css?v={{ v }}">
</head>
<body class="{% block body_class %}{% endblock %}" {% block body_attrs %}{% endblock %}>
{% block body %}{% endblock %}
<script src="/static/js/common.js?v={{ v }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
