# XcodeGen spec. On a Mac:  brew install xcodegen && cd ios && xcodegen generate && open PickThePlay.xcodeproj
# CI (.github/workflows/ios.yml) generates the project the same way, so no Mac is needed.
name: PickThePlay
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    # Game server the app talks to, e.g. https://pick-the-play.onrender.com (CI passes the
    # PTP_SERVER_URL repository variable). Players can also change it in Settings.
    PTP_SERVER_URL: ""
targets:
  PickThePlay:
    type: application
    platform: iOS
    sources:
      - path: PickThePlay
        excludes: ["PrivacyInfo.xcprivacy"]
    resources:
      - path: PickThePlay/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.PickThePlay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: PickThePlay/Info.plist
      properties:
        CFBundleDisplayName: Pick the Play
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        PTPServerURL: $(PTP_SERVER_URL)
        # Lets testers point the app at a game running on a computer on their Wi-Fi (http://192.168.x.x:8000).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Connect to a Pick the Play game running on a computer on your Wi-Fi.
  PickThePlayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PickThePlayTests
        excludes: ["Fixtures/**"]
      - path: PickThePlayTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: PickThePlay
schemes:
  PickThePlay:
    build:
      targets:
        PickThePlay: all
    run:
      config: Debug
    test:
      targets: [PickThePlayTests]
    profile:
      config: Release
    archive:
      config: Release
